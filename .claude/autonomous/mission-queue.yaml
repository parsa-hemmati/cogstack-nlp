    spec_section: "Phase 0: Environment Setup"
    estimated_hours: 8.0
    dependencies: [mvp-phase-0-task-1]
    status: blocked
    blocker_reason: "Requires MedCAT model URLs and credentials (not in spec)"
    execution_type: manual

    riper_cycle:
      research:
        - "Read MedCAT model requirements from spec"
        - "Identify required models: SNOMED-CT (2-5 GB), de-identification"
      innovate:
        - "Create models directory structure"
        - "Document download instructions"
      plan:
        - "Create medcat_models/ directory"
        - "Create subdirectories: snomed/, umls/, deid/"
        - "Document download commands with placeholders"
      execute:
        - "AUTONOMOUS: Create directory structure"
        - "MANUAL: User downloads models (requires credentials)"
        - "AUTONOMOUS: Create verification script"
      review:
        - "Verify directory structure exists"
        - "Document verification steps for user"

    sub_agents: []
    output:
      code_files: []
      documentation: ["Blocker file with download instructions", "Directory structure", "Verification script"]
      tests: []

    success_criteria:
      - "medcat_models/snomed/ directory exists"
      - "Model files extracted successfully (user action)"
      - "Checksum verification passed (user action)"
      - "Model size >= 1 GB (typical SNOMED model)"

