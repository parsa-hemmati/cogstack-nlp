version: '3.8'

# Clinical Care Tools - Production Docker Compose Configuration
#
# High-availability, secure production setup:
# - Health checks on all services
# - Resource limits enforced
# - Security best practices applied
# - Logging and monitoring configured
# - Database persistence with backups
# - Load balancing with nginx
# - Redis caching
# - PostgreSQL with replication ready
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.prod.yml logs -f backend
#   docker-compose -f docker-compose.prod.yml exec backend pytest tests/
#

services:
  # =========================================================================
  # Web Server (Nginx) - Reverse Proxy & Load Balancer
  # =========================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: cct-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/cache:/var/cache/nginx
    depends_on:
      - backend
    restart: always
    networks:
      - cct-network
    environment:
      NGINX_HOST: ${NGINX_HOST:-localhost}
      NGINX_PORT: 80
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # =========================================================================
  # FastAPI Backend Application
  # =========================================================================
  backend:
    image: ${BACKEND_IMAGE:-cct-backend:latest}
    container_name: cct-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.11"
    restart: always
    environment:
      # Core Configuration
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: info

      # Database
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      DATABASE_POOL_SIZE: 20
      DATABASE_POOL_PRE_PING: "true"

      # Redis
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Elasticsearch
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USER}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}

      # MedCAT Service
      MEDCAT_SERVICE_URL: ${MEDCAT_SERVICE_URL:-http://medcat-service:8000}
      MEDCAT_API_KEY: ${MEDCAT_API_KEY}

      # Security
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      REFRESH_TOKEN_EXPIRE_DAYS: 7

      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://localhost}

      # Encryption
      ENCRYPTION_ENABLED: "true"
      ENCRYPTION_ALGORITHM: aes-256-gcm
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Audit Logging
      AUDIT_LOGGING_ENABLED: "true"
      AUDIT_LOG_RETENTION_DAYS: 2555

      # Session Management
      SESSION_TIMEOUT_MINUTES: 480
      ABSOLUTE_SESSION_TIMEOUT_HOURS: 24
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_HTTPONLY: "true"
      SESSION_COOKIE_SAMESITE: "strict"

      # Rate Limiting
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS: 1000
      RATE_LIMIT_PERIOD_SECONDS: 60

      # Data Retention
      DEFAULT_DATA_RETENTION_DAYS: 2555
      AUTO_DELETION_ENABLED: "true"

      # Email Configuration
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}

      # Sentry/Error Tracking (optional)
      SENTRY_DSN: ${SENTRY_DSN:-}

    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/.pytest_cache
      - logs:/app/logs

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    networks:
      - cct-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        labels: "service=backend"

  # =========================================================================
  # PostgreSQL Database
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: cct-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/alembic:/docker-entrypoint-initdb.d
    networks:
      - cct-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # =========================================================================
  # PostgreSQL Backup Service
  # =========================================================================
  postgres-backup:
    image: postgres:16-alpine
    container_name: cct-postgres-backup
    restart: always
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_SCHEDULE: "0 2 * * *"  # Daily at 2 AM
    volumes:
      - postgres-backups:/backups
      - ./scripts/backup-postgres.sh:/backup.sh:ro
    entrypoint: /backup.sh
    depends_on:
      - postgres
    networks:
      - cct-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # =========================================================================
  # Redis Cache
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: cct-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - cct-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # =========================================================================
  # Elasticsearch for Patient Search & NLP Results
  # =========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: cct-elasticsearch
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.enrollment.enabled: "true"
      xpack.ml.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      ES_JAVA_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - cct-network
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # =========================================================================
  # MedCAT NLP Service (Optional - can be external)
  # =========================================================================
  medcat-service:
    image: ${MEDCAT_SERVICE_IMAGE:-cogstack/medcat-service:latest}
    container_name: cct-medcat-service
    restart: always
    environment:
      LOG_LEVEL: info
      API_KEY: ${MEDCAT_API_KEY}
      PORT: 8000
    volumes:
      - medcat-models:/medcat/models
    networks:
      - cct-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    profiles:
      - with-medcat

  # =========================================================================
  # Monitoring & Observability (Prometheus)
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: cct-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - cct-network
    ports:
      - "9090:9090"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    profiles:
      - monitoring

volumes:
  postgres-data:
    driver: local
  postgres-backups:
    driver: local
  redis-data:
    driver: local
  elasticsearch-data:
    driver: local
  medcat-models:
    driver: local
  prometheus-data:
    driver: local
  logs:
    driver: local

networks:
  cct-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
