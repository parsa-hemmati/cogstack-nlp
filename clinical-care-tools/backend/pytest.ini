[pytest]
# Pytest configuration for Clinical Care Tools backend

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test path
testpaths = tests

# Minimum Python version
minversion = 7.0

# Output options
addopts =
    # Verbose output
    -vv

    # Show summary of all test outcomes
    -ra

    # Print captured output on failed tests
    --tb=short

    # Coverage reporting
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml

    # Parallel execution (optional, install pytest-xdist)
    # -n auto

    # Show slowest tests
    --durations=10

    # Strict markers
    --strict-markers

    # Disable warnings in output
    --disable-warnings

# Markers for organizing tests
markers =
    unit: Unit tests (test individual functions/methods)
    integration: Integration tests (test multiple components together)
    e2e: End-to-end tests (test complete user workflows)
    slow: Slow running tests
    security: Security-critical tests
    compliance: Compliance-related tests (HIPAA, GDPR, etc)

# Coverage options
[coverage:run]
# Omit test files and venv from coverage
omit =
    */tests/*
    */site-packages/*
    */__pycache__/*
    */venv/*

# Ignore missing imports (for optional dependencies)
[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract

# Minimum coverage thresholds
fail_under = 85

# Show missing lines
show_missing = True

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (requires pytest-timeout)
# timeout = 300

# Environment variables for tests
env =
    ENVIRONMENT=test
    DATABASE_URL=sqlite:///:memory:
    REDIS_URL=redis://localhost:6379/1
    SECRET_KEY=test_secret_key_for_testing_only
