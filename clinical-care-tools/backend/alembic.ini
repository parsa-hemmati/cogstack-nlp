# Alembic Configuration File

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be named with an
# encoding of the change made:
# file_template = %%(rev)s_%%(slug)s_%%(ts_now)s

# sys.path path, will be prepended to sys.path if present
# as a string of comma-separated values
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as a string arg to datetime.datetime.now(datetime.timezone.utc)
# string value is passed to the constructor of datetime.timezone class

# When set to true, a timestamp is included in every revision file
# name, this matches the behavior of the Alembic revision command line
# script (which also adds the current timestamp).
sqlalchemy.url = postgresql+asyncpg://clinical_admin:changeme@localhost:5432/clinical_care_tools

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
