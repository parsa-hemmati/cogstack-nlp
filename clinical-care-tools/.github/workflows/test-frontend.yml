name: Frontend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run linter
      working-directory: ./frontend
      run: npm run lint
      continue-on-error: true

    - name: Type checking
      working-directory: ./frontend
      run: npm run type-check
      continue-on-error: true

    - name: Run tests with coverage
      working-directory: ./frontend
      run: npm run test:coverage -- --run

    - name: Archive coverage reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: vitest-coverage-${{ matrix.node-version }}
        path: |
          frontend/coverage/
        retention-days: 30

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./frontend/coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage-${{ matrix.node-version }}
        fail_ci_if_error: false

    - name: Comment PR with coverage (Node 18.x only)
      if: github.event_name == 'pull_request' && matrix.node-version == '18.x'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = './frontend/coverage/coverage-summary.json';

          if (fs.existsSync(path)) {
            const coverage = JSON.parse(fs.readFileSync(path, 'utf8'));
            const overall = coverage.total.lines.pct;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Frontend Test Coverage\n\n📊 Coverage: **${overall}%**\n\nSee artifacts for detailed HTML report.`
            });
          }
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build application
      working-directory: ./frontend
      run: npm run build

    - name: Archive build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frontend-build
        path: |
          frontend/dist/
        retention-days: 7

  a11y:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Check accessibility
      working-directory: ./frontend
      run: |
        # This would run axe-core or similar
        echo "Accessibility checks placeholder"
      continue-on-error: true
