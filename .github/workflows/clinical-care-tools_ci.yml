name: Clinical Care Tools CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'clinical-care-tools/**'
  pull_request:
    paths:
      - 'clinical-care-tools/**'

defaults:
  run:
    working-directory: ./clinical-care-tools

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install httpx pytest pytest-asyncio

      - name: Run Tests
        working-directory: ./clinical-care-tools/backend
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: |
          pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: clinical-care-tools/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./clinical-care-tools/frontend
        run: npm ci

      - name: Type Check
        working-directory: ./clinical-care-tools/frontend
        run: npm run type-check

      - name: Build
        working-directory: ./clinical-care-tools/frontend
        run: npm run build

  docker-build:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4
      
      # We just build to verify Dockerfiles are valid
      # In a real setup, we would push to a registry (GHCR/DockerHub)
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: clinical-care-tools/backend
          file: clinical-care-tools/docker/Dockerfile.backend
          push: false
          tags: clinical-care-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: clinical-care-tools/frontend
          file: clinical-care-tools/docker/Dockerfile.frontend
          push: false
          tags: clinical-care-frontend:latest
