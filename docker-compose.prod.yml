# =============================================================================
# Usage Instructions
# =============================================================================
#
# 1. Start with production hardening:
#    docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 2. Verify all services healthy:
#    docker-compose ps
#
# 3. Monitor resource usage:
#    docker stats
#
# 4. Check for OOM kills:
#    docker-compose logs | grep -i "killed"
#
# 5. Test application under load:
#    - Upload 100 documents simultaneously
#    - Run 1000 patient searches
#    - Monitor: docker stats --no-stream
#
# =============================================================================
# Troubleshooting
# =============================================================================
#
# Issue: Service killed (OOM - Out of Memory)
# Symptom: Container exits with code 137
# Solution: Increase memory limit for affected service
#   docker-compose logs <service>  # Check for "Killed" message
#   # Edit docker-compose.prod.yml to increase memory limit
#
# Issue: Service slow (CPU throttling)
# Symptom: High CPU usage, slow responses
# Solution: Increase CPU limit or optimize application
#   docker stats  # Check CPU percentage
#   # If consistently at 100%, increase cpus limit
#
# Issue: Permission denied (capability issue)
# Symptom: Service fails to start with permission error
# Solution: Identify required capability and add to cap_add
#   docker-compose logs <service>  # Check for permission errors
#   # Add required capability (e.g., NET_ADMIN, SYS_ADMIN)
#
# =============================================================================
# Security Notes
# =============================================================================
#
# 1. Resource Limits:
#    - Prevent resource exhaustion DoS attacks
#    - Protect against memory leaks
#    - Ensure system stability under high load
#
# 2. Capability Dropping:
#    - Follows principle of least privilege
#    - Reduces attack surface if container compromised
#    - Prevents privilege escalation exploits
#
# 3. Non-root Users:
#    - Limits impact of container breakout
#    - Prevents host file system modifications
#    - Aligns with CIS Docker Benchmark 4.1
#
# =============================================================================
# Compliance
# =============================================================================
#
# CIS Docker Benchmark:
#   - 5.11: Ensure that the memory usage for containers is limited ✓
#   - 5.12: Ensure that CPU priority is set appropriately on containers ✓
#   - 5.25: Ensure that the container is restricted from acquiring additional privileges ✓
#
# HIPAA Security Rule:
#   - 164.308(a)(7)(ii)(A): Data backup plan (resource stability) ✓
#   - 164.312(b): Audit controls (logging configured in base) ✓
#
# NIST SP 800-190:
#   - Resource isolation between containers ✓
#   - Principle of least privilege ✓
#
# =============================================================================
