# Docker Compose Production Security Hardening
# Version: 1.0.0
# Purpose: Production security overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file adds production-grade security hardening:
# 1. Resource limits (prevent resource exhaustion DoS)
# 2. Capability dropping (principle of least privilege)
# 3. Explicit non-root users (defense in depth)
#
# Based on:
# - CIS Docker Benchmark
# - OWASP Docker Security Cheat Sheet
# - NIST SP 800-190 (Container Security)

services:
  # ===========================================================================
  # PostgreSQL Database - Production Hardening
  # ===========================================================================
  postgres:
    # Resource limits: Prevent database from consuming all system memory
    # Sizing: 16GB RAM workstation, 2G for PostgreSQL (connections + buffers + queries)
    deploy:
      resources:
        limits:
          memory: 2G      # Max memory (triggers OOM kill if exceeded)
          cpus: '2.0'     # Max CPU cores (throttled if exceeded)
        reservations:
          memory: 512M    # Guaranteed memory reservation
          cpus: '0.5'     # Guaranteed CPU reservation

    # Security: Drop all Linux capabilities (PostgreSQL doesn't need any)
    cap_drop:
      - ALL

    # Note: Non-root user already configured in base docker-compose.yml (user: postgres)

  # ===========================================================================
  # Redis Cache - Production Hardening
  # ===========================================================================
  redis:
    # Resource limits: Match Redis --maxmemory config (512mb)
    deploy:
      resources:
        limits:
          memory: 512M    # Max memory (match Redis config)
          cpus: '1.0'     # Max CPU cores (cache operations)
        reservations:
          memory: 128M    # Guaranteed memory
          cpus: '0.25'    # Guaranteed CPU

    # Security: Drop all Linux capabilities (Redis doesn't need any)
    cap_drop:
      - ALL

    # Security: Explicit non-root user (defensive, redis image already runs as redis:redis)
    user: redis

  # ===========================================================================
  # MedCAT Service - Production Hardening
  # ===========================================================================
  medcat-service:
    # Note: Resource limits already configured in base docker-compose.yml
    # (memory: 4G, cpus: 2.0)

    # Security: Drop all Linux capabilities (MedCAT doesn't need any)
    cap_drop:
      - ALL

    # Note: Cannot add 'user' directive without verifying cogstacksystems/medcat-service
    # container's internal permissions. May break model loading.
    # Technical debt documented in CONTEXT.md: "MedCAT service non-root user: Not verified"
    # Test with: user: "1000:1000" and verify /cat/models permissions

  # ===========================================================================
  # Backend API - Production Hardening
  # ===========================================================================
  backend:
    # Resource limits: FastAPI + async workers + SQLAlchemy + MedCAT client
    deploy:
      resources:
        limits:
          memory: 2G      # Max memory for API processing
          cpus: '2.0'     # Max CPU cores (API requests + background jobs)
        reservations:
          memory: 512M    # Guaranteed memory
          cpus: '0.5'     # Guaranteed CPU

    # Note: Capabilities already dropped in base docker-compose.yml
    # (cap_drop: ALL, cap_add: NET_BIND_SERVICE)

    # Note: Non-root user already configured in base docker-compose.yml
    # (user: "${UID:-1000}:${GID:-1000}")

  # ===========================================================================
  # Frontend - Production Hardening
  # ===========================================================================
  frontend:
    # Resource limits: Node.js + Vite dev server (or nginx in production)
    deploy:
      resources:
        limits:
          memory: 512M    # Max memory for static file serving
          cpus: '1.0'     # Max CPU cores (limited CPU usage for static assets)
        reservations:
          memory: 256M    # Guaranteed memory
          cpus: '0.25'    # Guaranteed CPU

    # Security: Drop all Linux capabilities (Frontend doesn't need any)
    cap_drop:
      - ALL

    # Note: Non-root user already configured in base docker-compose.yml
    # (user: "${UID:-1000}:${GID:-1000}")

